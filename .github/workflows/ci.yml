# Minimal CI after P0 — unit tests only (no MLX weights, no live Grok).
# Current suite imports mission/hive/sage/propellant/wattos/tui_policy/policy only.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install unit-test dependencies
        run: |
          python -m pip install --upgrade pip
          # Core unit suite + optional FastAPI for server smoke (skipped if missing)
          pip install "rich>=13" "typer>=0.9" "huggingface_hub" pytest \
            "fastapi>=0.115" "httpx>=0.27" "uvicorn[standard]>=0.32"

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/ -q --tb=short
