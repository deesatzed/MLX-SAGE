[project]
name = "nex-cli"
version = "0.3.0"
description = "MLX-SAGE — personal sage partner on Apple Silicon (local MLX dialogue, living direction, hive joint beneficence). Package nex also provides multi-model Nex CLI, Superintendant rails, MCP, and OpenAI-compatible serve."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Local"}]

dependencies = [
    # Core (satisfied by the dedicated .venv)
    "mlx-lm>=0.20",
    "rich>=13",
    "typer>=0.9",
    "huggingface_hub",
    # For the MCP server (`nex mcp` or `python -m nex.mcp`)
    "mcp>=1.0",
]

[project.optional-dependencies]
tui = [
    "textual>=0.80",  # Modern SOTA TUI framework for beautiful reactive terminal UIs
]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
rag = [
    "sentence-transformers>=3.0",  # for semantic search over history
]
dev = [
    "textual[dev]>=0.80",
]

[project.scripts]
nex = "nex.cli:app"
grok-claude = "scripts.grok_claude:main"
grok-codex = "scripts.grok_codex:main"

[project.urls]
Homepage = "https://huggingface.co/jedisct1/Nex-N2-mini-mlx-OptiQ-4bit"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
# Fast, reproducible installs with uv (recommended over pip for this project)
dev-dependencies = [
    "textual[dev]>=0.80",
]
# Prefer the project's venv when using uv run
python-preference = "only-system"  # or "managed" if you want uv to handle Pythons

[tool.uv.sources]
# Local editable for development
nex-cli = { workspace = true }
